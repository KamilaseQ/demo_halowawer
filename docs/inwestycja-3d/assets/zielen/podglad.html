<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:#dfe6ec}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
// Podgląd zestawu roślin w three.js projektu (GLTFLoader + MeshoptDecoder), światło jak preset "Dzień" strony
// (słońce 4,4 #ffe2c2 z SW, HDRI zawiszy_czarnego 0,95, hemi 1,5, Neutral tone mapping).
//   ?tryb=scena&bor2=<glb>&rosliny=<glb>   - makieta BOR2 + rośliny na znacznikach (rozmiesc.mjs) + drzewa projektu
//   ?tryb=arkusz&rosliny=<glb>             - wszystkie warianty, każdy w osobnym polu
// Wystawia window.ready / window.info / window.shot(widok) / window.sheet() dla podglad.mjs.
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { HDRLoader } from "three/addons/loaders/HDRLoader.js";
import { rozmiesc } from "./rozmiesc.mjs";

window.errors = [];
const q = new URLSearchParams(location.search);
const MODE = q.get("tryb") || "scena";
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();

// niebo: gradient jak preset Dzień (zenit #3d7bc6, horyzont #dfe6ec)
{
  const c = document.createElement("canvas");
  c.width = 4; c.height = 256;
  const g = c.getContext("2d");
  const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, "#3d7bc6"); gr.addColorStop(0.75, "#a9c3dd"); gr.addColorStop(1, "#dfe6ec");
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
}
const pmrem = new THREE.PMREMGenerator(renderer);
const hdr = await new HDRLoader().loadAsync("/public/explorer/3d/hdri/zawiszy_czarnego_512.hdr");
hdr.mapping = THREE.EquirectangularReflectionMapping;
scene.environment = pmrem.fromEquirectangular(hdr).texture;
scene.environmentIntensity = 0.95;
const SUN_DIR = (() => { // daylight.ts: sun(232.4, 26.1), oś X modelu = azymut 100,5°
  const a = ((232.4 - 100.5) * Math.PI) / 180, h = (26.1 * Math.PI) / 180;
  return new THREE.Vector3(Math.cos(a) * Math.cos(h), Math.sin(h), Math.sin(a) * Math.cos(h)).normalize();
})();
const sun = new THREE.DirectionalLight("#ffe2c2", 4.4);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0003;
sun.shadow.normalBias = 0.03;
sun.shadow.radius = 2;
scene.add(sun, sun.target, new THREE.HemisphereLight("#c9d8ee", "#a8916e", 1.5));
function aimSun(center, r) {
  sun.position.copy(center).addScaledVector(SUN_DIR, r * 2);
  sun.target.position.copy(center);
  Object.assign(sun.shadow.camera, { left: -r, right: r, top: r, bottom: -r, near: 0.5, far: r * 4 });
  sun.shadow.camera.updateProjectionMatrix();
}

// --- materiał roślin jak w runtime (trees.tsx: DoubleSide + normalne bez odwracania + alpha-to-coverage) ----
function patchNoFlip(shader) {
  shader.fragmentShader = shader.fragmentShader.replace(
    "#include <normal_fragment_begin>",
    "float faceDirection = 1.0;\nvec3 normal = normalize( vNormal );\nvec3 nonPerturbedNormal = normal;");
}
function patchCoverage(shader) {
  shader.fragmentShader = shader.fragmentShader.replace("#include <map_fragment>", `#include <map_fragment>
  #ifdef USE_MAP
  {
    vec2 tx = vMapUv * vec2(textureSize(map, 0));
    vec2 dx = dFdx(tx);
    vec2 dy = dFdy(tx);
    diffuseColor.a *= 1.0 + max(0.0, 0.5 * log2(max(dot(dx, dx), dot(dy, dy)))) * 0.25;
  }
  #endif`);
}
function plantMaterial(src) {
  const m = src.clone();
  m.side = THREE.DoubleSide;
  m.alphaToCoverage = true;
  m.onBeforeCompile = (s) => { patchNoFlip(s); patchCoverage(s); };
  m.customProgramCacheKey = () => "rosliny";
  return m;
}

const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const t0 = performance.now();
let plants;
try {
  plants = await loader.loadAsync(q.get("rosliny"));
} catch (e) {
  window.errors.push(String(e?.message || e));
  window.ready = true;
  throw e;
}
const variants = {};
let sharedMat = null;
const mats = new Set();
plants.scene.traverse((o) => {
  if (!o.isMesh) return;
  mats.add(o.material.uuid);
  sharedMat ??= plantMaterial(o.material);
  variants[o.name] = { geometry: o.geometry, tris: o.geometry.index ? o.geometry.index.count / 3 : o.geometry.attributes.position.count / 3 };
});
window.info = {
  loadMs: Math.round(performance.now() - t0),
  variants: Object.fromEntries(Object.entries(variants).map(([k, v]) => {
    v.geometry.computeBoundingBox();
    const b = v.geometry.boundingBox;
    return [k, { tris: v.tris, h: +b.max.y.toFixed(2), minY: +b.min.y.toFixed(3), w: +(b.max.x - b.min.x).toFixed(2), d: +(b.max.z - b.min.z).toFixed(2) }];
  })),
  materials: mats.size,
  material: (() => { let m; plants.scene.traverse((o) => { if (o.isMesh) m = o.material; }); return { name: m.name, alphaTest: m.alphaTest, transparent: m.transparent, side: m.side, vertexColors: m.vertexColors, map: m.map?.image ? [m.map.image.width, m.map.image.height] : null }; })(),
};

function instanced(list, castShadow = true) {
  const groups = {};
  for (const p of list) (groups[p.wariant] ??= []).push(p);
  const g = new THREE.Group();
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), UPV = new THREE.Vector3(0, 1, 0), C = new THREE.Color();
  for (const [name, ps] of Object.entries(groups)) {
    const v = variants[name];
    if (!v) { window.errors.push("brak wariantu " + name); continue; }
    const mesh = new THREE.InstancedMesh(v.geometry, sharedMat, ps.length);
    ps.forEach((p, i) => {
      Q.setFromAxisAngle(UPV, p.rot);
      M.compose(new THREE.Vector3(p.x, p.y, p.z), Q, new THREE.Vector3(p.sx, p.sy, p.sz));
      mesh.setMatrixAt(i, M);
      const k = 0.94 + ((i * 0.6180339) % 1) * 0.12; // ±6% jasności na egzemplarz
      mesh.setColorAt(i, C.setRGB(k, k, k));
    });
    mesh.castShadow = castShadow;
    mesh.receiveShadow = true;
    mesh.frustumCulled = false;
    mesh.name = name;
    g.add(mesh);
  }
  return g;
}

const camera = new THREE.PerspectiveCamera(45, W / H, 0.05, 3000);
function render(cam) {
  renderer.info.reset();
  renderer.info.autoReset = false;
  renderer.render(scene, cam);
  window.lastCalls = renderer.info.render.calls;
  window.lastTris = renderer.info.render.triangles;
  renderer.info.autoReset = true;
  return renderer.domElement.toDataURL("image/jpeg", 0.92);
}

if (MODE === "scena") {
  const ext = await loader.loadAsync(q.get("bor2"));
  const root = ext.scene;
  root.updateMatrixWorld(true);
  for (const n of ["ZIELEN"]) { const o = root.getObjectByName(n); if (o) o.visible = false; }
  root.traverse((o) => { if (/^KADR_/.test(o.name)) o.visible = false; if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(root);
  // grunt poza działką (łąka / pas traw za płotem): model BOR2 kończy się na ogrodzeniu, w runtime grunt
  // daje teren osiedla. Płaszczyzna ze spadkiem terenu jak w wyglad_zielen.py (0,9 - 0,0108 (x - 33)).
  {
    const g = new THREE.PlaneGeometry(500, 500, 100, 100).rotateX(-Math.PI / 2);
    const pa = g.attributes.position;
    g.translate(60, 0, -50);
    for (let i = 0; i < pa.count; i++) pa.setY(i, 0.9 - 0.0108 * (pa.getX(i) - 33) - 0.04);
    g.computeVertexNormals();
    const c = document.createElement("canvas");
    c.width = c.height = 256;
    const x2 = c.getContext("2d");
    x2.fillStyle = "#6b7a45"; x2.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 9000; i++) {
      const v = Math.random();
      x2.fillStyle = v < 0.5 ? "rgba(52,66,30,0.35)" : v < 0.85 ? "rgba(140,150,90,0.3)" : "rgba(170,160,110,0.3)";
      x2.fillRect(Math.random() * 256, Math.random() * 256, 1 + Math.random() * 2, 1 + Math.random() * 3);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(250, 250);
    tex.anisotropy = 8;
    const lawn = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: tex, roughness: 1 }));
    lawn.receiveShadow = true;
    scene.add(lawn);
  }
  const zz = root.getObjectByName("ZIELEN_ZNACZNIKI");
  const P = new THREE.Vector3(), Qt = new THREE.Quaternion(), S = new THREE.Vector3(), E = new THREE.Euler();
  const markers = zz.children.map((o) => {
    o.matrixWorld.decompose(P, Qt, S);
    return { name: o.name, x: P.x, y: P.y, z: P.z, rot: E.setFromQuaternion(Qt, "YXZ").y, scale: S.x };
  });
  const map = await (await fetch(q.get("mapowanie"))).json();
  const placed = rozmiesc(markers, map);
  scene.add(instanced(placed));
  // drzewa projektu (drzewa.glb) na znacznikach DRZEWO_* jak w Bor2Planting.tsx
  const trees = await loader.loadAsync("/public/explorer/3d/models/drzewa.glb");
  const HEIGHT = { "sosna-1": 21, "sosna-2": 17, "sosna-3": 18, "brzoza-1": 15, "brzoza-2": 13, "dab-1": 16, "lipa-1": 14 };
  const treeOf = (kind, i) => kind === "DRZEWO_SOSNA" ? [["sosna-1", "sosna-2", "sosna-3"][i % 3], 13] : kind === "DRZEWO_BRZOZA" ? [i % 2 ? "brzoza-2" : "brzoza-1", 11]
    : kind === "DRZEWO_LISCIASTE" ? [i % 2 ? "dab-1" : "lipa-1", 10] : kind === "DRZEWO_OZDOBNE" ? ["lipa-1", 6.3] : null;
  for (const m of markers) {
    const mm = /^(.*?)_(\d+)$/.exec(m.name);
    const t = treeOf(mm[1], +mm[2]);
    if (!t) continue;
    // węzeł gatunku zachowuje własną transformację z drzewa.glb (jak matrixWorld w trees.tsx)
    const node = new THREE.Group();
    node.add(trees.scene.getObjectByName(t[0]).clone(true));
    node.position.set(m.x, m.y, m.z);
    node.rotation.set(0, m.rot, 0);
    node.scale.setScalar((t[1] * m.scale) / HEIGHT[t[0]]);
    node.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; if (o.material.alphaTest > 0 || o.material.transparent) { o.material = o.material.clone(); o.material.side = THREE.DoubleSide; } } });
    scene.add(node);
  }
  const counts = {};
  for (const p of placed) counts[p.wariant] = (counts[p.wariant] || 0) + 1;
  window.info.placed = placed.length;
  window.info.counts = counts;
  const ray = new THREE.Raycaster();
  const ground = root.getObjectByName("ZIEMIA") || root;
  const groundY = (x, z) => {
    ray.set(new THREE.Vector3(x, 50, z), new THREE.Vector3(0, -1, 0));
    const hit = ray.intersectObject(ground, true)[0];
    return hit ? hit.point.y : 0;
  };
  const VIEWS = {
    // ujecia-porownawcze.json (bor2): kamera W5 = kadr visualization-1
    wiz1: { pos: [99.817, 1.775, -20.083], target: [99.803, 1.775, -30.083], fov: 45, shift: 0.27 },
    wiz5: { pos: [55.953, 4.5, -78.839], target: [51.806, 4.5, -69.739], fov: 40, shift: 0.22, hide: ["KONTEKST_6"] },
    // spacer: oczy 1,65 m nad gruntem, pas traw przed płotem ogrodów A/B
    spacer: { eye: [100.6, -26.6], look: [101.2, -34.0], drop: 0.9, fov: 50 },
    spacer_bliski: { eye: [97.4, -28.6], look: [99.2, -32.2], drop: 1.5, fov: 50 },
    // ogrody C/D (żywopłot na przegrodzie, krzewy przy tarasie) zza płotu
    spacer_ogrod: { eye: [72.0, -33.4], look: [76.0, -41.5], drop: 1.0, fov: 50 },
  };
  window.shot = (name) => {
    const v = VIEWS[name];
    if (!v) return null;
    for (const n of ["KONTEKST_6"]) { const o = root.getObjectByName(n); if (o) o.visible = !(v.hide || []).includes(n); }
    let pos, target;
    if (v.pos) { pos = new THREE.Vector3(...v.pos); target = new THREE.Vector3(...v.target); }
    else {
      pos = new THREE.Vector3(v.eye[0], groundY(v.eye[0], v.eye[1]) + 1.65, v.eye[1]);
      target = new THREE.Vector3(v.look[0], groundY(v.look[0], v.look[1]) + 1.65 - v.drop, v.look[1]);
    }
    camera.position.copy(pos);
    camera.lookAt(target);
    camera.fov = v.fov;
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
    if (v.shift) camera.projectionMatrix.elements[9] += 2 * v.shift, camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
    aimSun(new THREE.Vector3().lerpVectors(pos, target, 0.5).add(new THREE.Vector3(0, 0, 0)), 45);
    return render(camera);
  };
  window.ready = true;
} else {
  // arkusz: 7 typów (kolumny) x 3 warianty (wiersze), każdy w osobnym polu
  const TYPES = ["TRAWA_NISKA", "TRAWA_WYSOKA", "PODSZYT", "BYLINA_BIALA", "BYLINA_ZOLTA", "BYLINA_FIOLET", "BYLINA_ROZ", "KRZEW", "ZYWOPLOT"];
  const disc = new THREE.Mesh(new THREE.CircleGeometry(3, 64).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: "#6f7d4c", roughness: 1 }));
  disc.receiveShadow = true;
  scene.add(disc);
  scene.background = new THREE.Color("#c9d6e2");
  let current = null;
  window.sheet = () => {
    const cols = TYPES.length, rows = 3, cw = Math.floor(W / cols), ch = Math.floor(H / rows);
    renderer.setScissorTest(true);
    for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
      const name = `${TYPES[c]}_${r + 1}`;
      if (current) scene.remove(current);
      current = instanced([{ wariant: name, x: 0, y: 0, z: 0, rot: 0.6, sx: 1, sy: 1, sz: 1 }]);
      scene.add(current);
      const b = window.info.variants[name];
      const size = Math.max(b.h, Math.max(b.w, b.d) * 0.75);
      const cam = new THREE.PerspectiveCamera(32, cw / ch, 0.05, 100);
      const dist = size / (2 * Math.tan((16 * Math.PI) / 180)) * 1.25;
      const elev = 0.32; // ~18° z góry - jak z oczu 1,65 m na roślinę 2-4 m dalej
      cam.position.set(0, b.h * 0.45 + Math.sin(elev) * dist, Math.cos(elev) * dist);
      cam.lookAt(0, b.h * 0.45, 0);
      aimSun(new THREE.Vector3(0, b.h / 2, 0), 3);
      const x = c * cw, y = (rows - 1 - r) * ch;
      renderer.setViewport(x, y, cw, ch);
      renderer.setScissor(x, y, cw, ch);
      renderer.render(scene, cam);
    }
    renderer.setScissorTest(false);
    return renderer.domElement.toDataURL("image/jpeg", 0.92);
  };
  window.ready = true;
}
</script>
</body>
</html>
