<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:#d9e1e4}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
// Ładuje GLB tak jak strona (GLTFLoader + MeshoptDecoder, three z node_modules projektu)
// i wystawia window.info / window.shot dla verify.mjs. Plik: ?glb=/docs/.../model.glb
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

window.errors = [];
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.NeutralToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color("#d9e1e4");
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;
const camera = new THREE.PerspectiveCamera(35, W / H, 0.05, 5000);
const sun = new THREE.DirectionalLight("#ffe7c7", 3.0);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.05;
scene.add(sun, sun.target, new THREE.HemisphereLight("#dbe6ef", "#7d8a5c", 0.8));

const url = new URLSearchParams(location.search).get("glb");
const t0 = performance.now();
let gltf;
try {
  gltf = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(url);
} catch (e) {
  window.errors.push(String(e && e.message || e));
  window.ready = true;
  throw e;
}
const loadMs = Math.round(performance.now() - t0);
const model = gltf.scene;
model.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
scene.add(model);

const box = new THREE.Box3().setFromObject(model);
const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
const radius = size.length() / 2;
sun.position.copy(center).add(new THREE.Vector3(-0.71, 0.6, 0.55).multiplyScalar(radius * 1.5));
sun.target.position.copy(center);
Object.assign(sun.shadow.camera, { left: -radius, right: radius, top: radius, bottom: -radius, near: 0.5, far: radius * 4 });
sun.shadow.camera.updateProjectionMatrix();

const mats = new Map(), names = [];
let meshes = 0;
model.traverse((o) => {
  if (!o.isMesh) return;
  meshes++;
  if (o.parent === model || o.parent?.parent === model) names.push(o.name || o.parent.name);
  for (const m of [].concat(o.material)) mats.set(m.uuid, m);
});
window.info = {
  loadMs,
  meshes,
  topNodes: model.children.map((c) => c.name),
  size: size.toArray().map((v) => +v.toFixed(2)),
  center: center.toArray().map((v) => +v.toFixed(2)),
  materials: mats.size,
  transparent: [...mats.values()].filter((m) => m.transparent).map((m) => m.name),
  textured: [...mats.values()].filter((m) => m.map).length,
  cameras: gltf.cameras.map((c) => c.name || c.parent?.name),
};

window.shot = (view) => {
  const cam = view === "aerial" || view === "inside" ? camera : gltf.cameras.find((c) => (c.name || c.parent?.name) === view || c.parent?.name === view);
  if (view === "aerial") {
    camera.position.copy(center).add(new THREE.Vector3(1, 0.9, 1.2).normalize().multiplyScalar(radius * 1.9));
    camera.lookAt(center);
  } else if (view === "inside") {
    camera.position.copy(center).add(new THREE.Vector3(0, size.y * 0.5 + radius * 0.6, 0.01));
    camera.lookAt(center);
  } else if (!cam) {
    return null;
  }
  if (cam !== camera) { cam.aspect = W / H; cam.updateProjectionMatrix(); }
  renderer.info.reset();
  renderer.info.autoReset = false;
  renderer.render(scene, cam || camera);
  window.lastCalls = renderer.info.render.calls;
  window.lastTris = renderer.info.render.triangles;
  renderer.info.autoReset = true;
  return renderer.domElement.toDataURL("image/jpeg", 0.88);
};
window.ready = true;
</script>
</body>
</html>
